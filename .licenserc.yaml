# The license header check that CI runs: https://github.com/apache/skywalking-eyes
header:
  license:
    spdx-id: Apache-2.0
    copyright-owner: Apache Software Foundation
  paths-ignore:
    # Files that can't carry a header. The docs state the license in their front matter.
    - ".github/PULL_REQUEST_TEMPLATE"
    - ".python-version"
    - "docs/**/*.md"
    - "LICENSE"
    - "LICENSE.bin"
    - "NOTICE"
    - "NOTICE.bin"
    - "uv.lock"
  comment: never
