[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gravitino-mcp-gateway"
version = "2.0.0.dev0"
description = "Apache Gravitino MCP Gateway: sign-in, access control and audit for MCP servers"
readme = "README.md"
license = "Apache-2.0"
# Not LICENSE.bin and NOTICE.bin, which cover the Docker image's bundled packages.
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [{ name = "Apache Software Foundation", email = "dev@gravitino.apache.org" }]
maintainers = [{ name = "Apache Gravitino Community", email = "dev@gravitino.apache.org" }]
classifiers = [
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
]
# The gateway server, the CLI (whose local proxy runs on FastAPI) and the SDK.
dependencies = [
    "click>=8.1,<9",
    "cryptography>=50.0.1,<52",
    "fastapi>=0.132.0,<1",
    "httpx>=0.27.0,<1",
    "jinja2>=3.1.6,<4",
    "prometheus-client>=0.21.1,<1",
    # 7.x fails on current FastAPI ('_IncludedRouter' object has no attribute 'path').
    "prometheus-fastapi-instrumentator>=8.1.0,<9",
    "psutil>=7.2.2,<8",
    "pydantic>=2.10.3,<3",
    "pydantic-settings>=2.6.1,<3",
    "pyjwt[crypto]>=2.13.0,<3",
    "pymysql>=1.1.1,<2",
    "python-multipart>=0.0.30,<1",
    "requests>=2.32.4,<3",
    "sqlalchemy>=2.0.36,<3",
    "uvicorn[standard]>=0.32.1,<1",
]

# Secret-storage backends (SECRET_STORAGE_BACKEND) and the Slack bot.
[project.optional-dependencies]
aws = ["boto3>=1.35.0,<2"]
azure = ["azure-identity>=1.19.0,<2", "azure-keyvault-secrets>=4.8.0,<5"]
gcp = ["google-cloud-secret-manager>=2.21.1,<3"]
slack = ["aiohttp>=3.14.3,<4", "slack-bolt>=1.21.3,<2"]

[project.urls]
Homepage = "https://gravitino.apache.org/"
"Source Code" = "https://github.com/apache/gravitino"
"Bug Tracker" = "https://github.com/apache/gravitino/issues"

[project.scripts]
gravitino-mcp = "mcp_gateway_cli.cli:cli"

[dependency-groups]
dev = [
    "pylint==3.3.8",
    "pytest>=8.4.1",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
]

[tool.setuptools.packages.find]
include = [
    "mcp_gateway",
    "mcp_gateway.*",
    "mcp_gateway_cli",
    "mcp_gateway_cli.*",
    "mcp_gateway_sdk",
    "mcp_gateway_sdk.*",
]

[tool.setuptools.package-data]
mcp_gateway = ["templates/*.html"]

[tool.black]
# The oldest Python the project supports, as requires-python says.
target-version = ["py311"]

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
# Make the MCP Gateway packages importable without installing them
pythonpath = ["."]
markers = [
    "integration: marks tests as integration tests (require live backends/DB)",
]

[tool.coverage.run]
source = ["mcp_gateway", "mcp_gateway_cli", "mcp_gateway_sdk"]
omit = ["tests/*", "**/__pycache__/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
