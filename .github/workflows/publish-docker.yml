# Publishes the Docker image of a release in dist/release, with
# dev/release/publish-docker.sh and the Docker Hub account ASF Infra provides.

name: Publish Docker image

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release in dist/release, such as 0.1.0"
        required: true
        type: string
      latest:
        description: "Also tag it latest (the newest release only)"
        type: boolean
        default: false
      dry_run:
        description: "Build for both architectures without pushing"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  publish:
    name: Publish Docker image
    # Only these release managers may publish, and only from main. Add a release
    # manager's GitHub login here, in a pull request, before their first release.
    if: >-
      github.repository == 'apache/gravitino-mcp-gateway' &&
      github.ref == 'refs/heads/main' &&
      contains(fromJSON('["bharos", "jerryshao"]'), github.triggering_actor)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install svn
        run: sudo apt-get update -q && sudo apt-get install -y -q subversion
      - name: Set up QEMU, for the arm64 build
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Sign in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        env:
          VERSION: ${{ inputs.version }}
          LATEST: ${{ inputs.latest }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=()
          if [[ "$DRY_RUN" == true ]]; then args+=(-n); fi
          if [[ "$LATEST" == true ]]; then args+=(-l); fi
          # Starting the workflow is the go-ahead, so answer the script's question.
          dev/release/publish-docker.sh "${args[@]}" "$VERSION" < <(yes)
