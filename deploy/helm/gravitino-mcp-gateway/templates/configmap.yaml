apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "gmg.fullname" . }}
  labels:
    {{- include "gmg.labels" . | nindent 4 }}
data:
  JWT_AUDIENCE: {{ required "config.JWT_AUDIENCE is required" .Values.config.JWT_AUDIENCE | quote }}
  {{- range $name, $value := .Values.config }}
  {{- if and (ne $name "JWT_AUDIENCE") (ne (toString $value) "") }}
  {{ $name }}: {{ $value | toString | quote }}
  {{- end }}
  {{- end }}
  {{- if .Values.catalog.servers }}
  MCP_CATALOG_FILE: /etc/gateway/catalog/catalog.json
  {{- end }}
{{- if .Values.catalog.servers }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "gmg.fullname" . }}-catalog
  labels:
    {{- include "gmg.labels" . | nindent 4 }}
data:
  catalog.json: |
    {{- dict "servers" .Values.catalog.servers | toPrettyJson | nindent 4 }}
{{- end }}
