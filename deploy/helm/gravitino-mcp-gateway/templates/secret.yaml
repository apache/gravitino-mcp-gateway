{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gmg.fullname" . }}
  labels:
    {{- include "gmg.labels" . | nindent 4 }}
type: Opaque
stringData:
  JWT_SECRET_KEY: {{ required "secrets.JWT_SECRET_KEY, or secrets.existingSecret, is required" .Values.secrets.JWT_SECRET_KEY | quote }}
  TOKEN_ENCRYPTION_KEY: {{ required "secrets.TOKEN_ENCRYPTION_KEY, or secrets.existingSecret, is required" .Values.secrets.TOKEN_ENCRYPTION_KEY | quote }}
  rsa-private-key.pem: {{ required "secrets.rsaPrivateKey, or secrets.existingSecret, is required" .Values.secrets.rsaPrivateKey | quote }}
  DATABASE_URL: {{ required "secrets.extra.DATABASE_URL, or secrets.existingSecret, is required: SQLite is lost with the pod" .Values.secrets.extra.DATABASE_URL | quote }}
  {{- range $name, $value := .Values.secrets.extra }}
  {{- if ne $name "DATABASE_URL" }}
  {{ $name }}: {{ $value | quote }}
  {{- end }}
  {{- end }}
{{- end }}
