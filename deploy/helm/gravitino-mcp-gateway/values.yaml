# Settings for the Apache Gravitino MCP Gateway. See docs/gravitino-mcp-gateway.md,
# "Run on Kubernetes", and mcp_gateway/config.py for every setting.

# More than one replica needs a shared MySQL database (DATABASE_URL below). The
# gateway keeps no session state a replica can't rebuild, so no session affinity is needed.
replicaCount: 2

image:
  repository: apache/gravitino-mcp-gateway
  # Pin a release, such as 0.1.0, so every replica runs the same one.
  tag: latest
  pullPolicy: IfNotPresent
imagePullSecrets: []

# Settings that are not secret, as environment variables of the gateway (the
# names in mcp_gateway/config.py). The image sets ENVIRONMENT=production, which
# refuses unsafe settings. Values are strings, so quote true, false and numbers.
config:
  # Required: the audience people's tokens must have.
  JWT_AUDIENCE: ""
  # Required in production: https, and the address people reach the gateway at.
  GATEWAY_BASE_URL: ""
  # Required in production: the web UI's origins, not "*".
  CORS_ALLOWED_ORIGINS: ""
  # OIDC_PROVIDER: keycloak
  # OIDC_DISCOVERY_URL: https://keycloak.example.com/realms/gravitino/.well-known/openid-configuration
  # GATEWAY_OAUTH_CLIENT_ID: gravitino-mcp-gateway
  # ADMIN_EMAILS: admin@example.com
  # GRAVITINO_MCP_URL: http://gravitino-mcp:8000/mcp
  # Behind an ingress or load balancer, so the audit log records callers' addresses.
  # FORWARDED_ALLOW_IPS: "10.0.0.0/8"

# Secrets, in a Secret the chart creates, or in one you manage.
secrets:
  # A Secret that holds the keys below, such as one from an external secrets
  # operator. When set, the chart creates none and the values below are ignored.
  existingSecret: ""
  # At least 32 characters: python -c "import secrets; print(secrets.token_hex(32))"
  JWT_SECRET_KEY: ""
  # python -c "import base64, os; print(base64.b64encode(os.urandom(32)).decode())"
  TOKEN_ENCRYPTION_KEY: ""
  # The PEM that signs tokens for MCP servers: openssl genrsa 2048. In an existing
  # Secret, the key is rsa-private-key.pem.
  rsaPrivateKey: ""
  # More settings that are secret, such as DATABASE_URL, GATEWAY_OAUTH_CLIENT_SECRET
  # and SLACK_BOT_TOKEN. DATABASE_URL is required: mysql+pymysql://user:password@host:3306/database
  extra: {}

# MCP servers declared in code: each entry has the fields of POST /api/v1/admin/mcp/,
# except the secrets. They are applied at every start and win over the admin API;
# servers not listed are left alone. See "Declare MCP servers in a file".
catalog:
  servers: []
  # - service_id: trino
  #   name: Trino
  #   mcp_url: http://trino-mcp:8000/mcp
  #   auto_sso_enabled: true
  #   audience: trino-mcp
  #   requires_approval: false

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: mcp-gateway.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  # - secretName: mcp-gateway-tls
  #   hosts: [mcp-gateway.example.com]

# GET /metrics is not authenticated, and the ingress does not route it by
# default: only the scraper should reach the pods.
metrics:
  # Annotations for Prometheus's pod discovery.
  annotations: true

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

# Keeps at least this many replicas through node drains; 0 creates none.
podDisruptionBudget:
  minAvailable: 1
