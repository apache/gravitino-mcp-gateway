github:
  description: "Apache Gravitino MCP Gateway: a secure authentication gateway for MCP servers, with single sign-on, access control and auditing."
  homepage: https://gravitino.apache.org
  labels:
    - gravitino
    - mcp
    - model-context-protocol
    - mcp-gateway
    - ai
    - oauth
    - access-control
  features:
    wiki: false
    issues: true
    projects: false
    discussions: false
  enabled_merge_buttons:
    squash: true
    merge: false
    rebase: true
  protected_branches:
    main: {}
  dependabot_alerts: true
  dependabot_updates: false
  collaborators:
    - markhoerth
notifications:
  commits: commits@gravitino.apache.org
  issues: commits@gravitino.apache.org
  pullrequests: commits@gravitino.apache.org
