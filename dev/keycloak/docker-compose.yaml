# Keycloak, Gravitino and Gravitino's MCP server, for running the MCP gateway
# against them locally. Not for production.

name: mcp-gateway-keycloak

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.2.5
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # Tokens carry this issuer, however Keycloak is reached.
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports:
      - "8080:8080"

  keycloak-setup:
    image: quay.io/keycloak/keycloak:26.2.5
    depends_on:
      - keycloak
    entrypoint: ["/bin/bash", "/setup-realm.sh"]
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    volumes:
      - ./setup-realm.sh:/setup-realm.sh:ro

  gravitino:
    image: apache/gravitino:1.3.1
    depends_on:
      keycloak-setup:
        condition: service_completed_successfully
    environment:
      GRAVITINO_AUTHORIZATION_ENABLE: "true"
      GRAVITINO_AUTHORIZATION_SERVICE_ADMINS: alice
    # Gravitino accepts Keycloak's tokens for its audience, "gravitino". Its web
    # UI signs in with Keycloak and shows the gateway's pages.
    entrypoint:
      - /bin/bash
      - -c
      - |
        cat >> conf/gravitino.conf <<'EOF'
        gravitino.authenticators = oauth
        gravitino.authenticator.oauth.serviceAudience = gravitino
        gravitino.authenticator.oauth.tokenValidatorClass = org.apache.gravitino.server.authentication.JwksTokenValidator
        gravitino.authenticator.oauth.jwksUri = http://keycloak:8080/realms/gravitino/protocol/openid-connect/certs
        gravitino.authenticator.oauth.authority = http://localhost:8080/realms/gravitino
        gravitino.authenticator.oauth.principalFields = preferred_username,email,sub
        gravitino.authenticator.oauth.provider = oidc
        gravitino.authenticator.oauth.clientId = gravitino-ui
        gravitino.authenticator.oauth.scope = openid profile email
        gravitino.server.visibleConfigs = gravitino.mcpGateway.uri
        gravitino.mcpGateway.uri = http://localhost:8000
        EOF
        exec /bin/bash docker/docker-entrypoint.sh
    ports:
      - "8090:8090"

  gravitino-setup:
    image: apache/gravitino:1.3.1
    depends_on:
      - gravitino
    entrypoint: ["/bin/bash", "/setup-gravitino.sh"]
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      GRAVITINO_URL: http://gravitino:8090
    volumes:
      - ./setup-gravitino.sh:/setup-gravitino.sh:ro

  gravitino-mcp:
    image: apache/gravitino-mcp-server:1.3.1
    depends_on:
      - gravitino
    command:
      - --metalake=demo
      - --gravitino-uri=http://gravitino:8090
      - --transport=http
      - --mcp-url=http://0.0.0.0:8000/mcp
    ports:
      - "8100:8000"
